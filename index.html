<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>REH DOGG: SUDS OF FURY</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #02030a;
      color: #f8fbff;
      font-family: Impact, "Arial Black", "Segoe UI", sans-serif;
      touch-action: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -8%;
      z-index: 5;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.055) 0 1px, transparent 1px 5px),
        radial-gradient(circle at 50% 18%, rgba(0, 195, 255, .18), transparent 28%),
        radial-gradient(circle at 18% 82%, rgba(255, 219, 58, .11), transparent 26%);
      mix-blend-mode: screen;
      opacity: .5;
      animation: scanlineDrift 4.5s linear infinite;
    }

    @keyframes scanlineDrift {
      from { transform: translateY(0); }
      to { transform: translateY(20px); }
    }

    .game {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      background:
        radial-gradient(circle at 50% 46%, rgba(0, 168, 255, .24), transparent 34%),
        linear-gradient(160deg, #02030a, #06162a 56%, #010207);
    }

    .soap-bubbles,
    .soap-bubbles::before,
    .soap-bubbles::after {
      position: absolute;
      inset: -10%;
      z-index: 2;
      content: "";
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 78%, rgba(126, 230, 255, .58) 0 8px, transparent 9px),
        radial-gradient(circle at 24% 42%, rgba(126, 230, 255, .22) 0 11px, transparent 12px),
        radial-gradient(circle at 82% 22%, rgba(126, 230, 255, .4) 0 12px, transparent 13px),
        radial-gradient(circle at 48% 88%, rgba(255, 255, 255, .28) 0 6px, transparent 7px),
        radial-gradient(circle at 70% 72%, rgba(255, 255, 255, .18) 0 18px, transparent 19px),
        radial-gradient(circle at 88% 84%, rgba(126, 230, 255, .24) 0 7px, transparent 8px);
      animation: bubbles 8s linear infinite;
    }

    .soap-bubbles::before {
      animation-duration: 13s;
      animation-direction: reverse;
      opacity: .55;
    }

    .soap-bubbles::after {
      animation-duration: 17s;
      opacity: .35;
    }

    @keyframes bubbles {
      from { transform: translateY(8%); }
      to { transform: translateY(-8%); }
    }

    .transition-fade,
    .screen-flash {
      position: fixed;
      inset: 0;
      z-index: 10000;
      pointer-events: none;
      opacity: 0;
    }

    .transition-fade {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 52%, rgba(0, 195, 255, .22), transparent 30%),
        linear-gradient(160deg, #00040b, #051a32 58%, #000);
      overflow: hidden;
    }

    .transition-fade.active {
      animation: clipFade .72s ease both;
    }

    .transition-fade::before,
    .transition-fade::after {
      content: "";
      position: absolute;
      inset: -12%;
      pointer-events: none;
    }

    .transition-fade::before {
      background:
        radial-gradient(circle at 16% 84%, rgba(126, 230, 255, .45) 0 9px, transparent 10px),
        radial-gradient(circle at 72% 22%, rgba(126, 230, 255, .34) 0 15px, transparent 16px),
        radial-gradient(circle at 42% 76%, rgba(255, 255, 255, .24) 0 7px, transparent 8px),
        radial-gradient(circle at 85% 72%, rgba(126, 230, 255, .22) 0 10px, transparent 11px);
      animation: bubbles 4.4s linear infinite;
    }

    .transition-fade::after {
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 5px),
        linear-gradient(90deg, transparent, rgba(121,232,255,.1), transparent);
      mix-blend-mode: screen;
      opacity: .48;
      animation: scanlineDrift 1.6s linear infinite;
    }

    .transition-message {
      position: relative;
      z-index: 2;
      width: min(92vw, 760px);
      padding: 22px 18px;
      color: #ffdc32;
      font-size: clamp(2rem, 8vw, 5.4rem);
      line-height: .92;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .05em;
      text-shadow:
        0 5px 0 #003d73,
        0 0 24px rgba(255, 220, 50, .76),
        0 0 54px rgba(0, 195, 255, .66);
      animation: transitionTextPulse .7s ease-in-out infinite alternate;
    }

    @keyframes transitionTextPulse {
      from { transform: scale(.99); filter: brightness(1); }
      to { transform: scale(1.02); filter: brightness(1.18); }
    }

    .game.scene-zoom video {
      animation: sceneZoomPulse .42s ease both;
    }

    .screen-flash.active {
      animation: screenFlash .28s ease-out both;
    }

    .screen-flash.attack {
      background: radial-gradient(circle at 50% 50%, rgba(110, 240, 255, .72), rgba(0, 109, 255, .24) 38%, transparent 72%);
    }

    .screen-flash.fail,
    .screen-flash.timeout {
      background: radial-gradient(circle at 50% 50%, rgba(255, 46, 46, .7), rgba(120, 0, 0, .28) 42%, transparent 76%);
    }

    @keyframes clipFade {
      0% { opacity: 0; }
      18% { opacity: .98; }
      74% { opacity: .98; }
      100% { opacity: 0; }
    }

    @keyframes screenFlash {
      0% { opacity: 0; }
      22% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes sceneZoomPulse {
      0% { transform: scale(1); }
      45% { transform: scale(1.018); }
      100% { transform: scale(1); }
    }

    video {
      width: min(100vw, 177.78vh);
      width: min(100vw, 177.78dvh);
      height: min(100vh, 56.25vw);
      height: min(100dvh, 56.25vw);
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
      box-shadow: 0 0 42px rgba(0, 195, 255, .26);
    }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none;
      place-items: center;
      padding: clamp(16px, 4vw, 42px);
      text-align: center;
    }

    .screen.active {
      display: grid;
      animation: screenIn .22s ease both;
    }

    #titleScreen {
      background:
        radial-gradient(circle at 50% 48%, rgba(0, 195, 255, .2), transparent 34%),
        radial-gradient(circle at 50% 88%, rgba(255, 220, 50, .08), transparent 28%),
        #000;
      overflow: hidden;
    }

    #titleScreen::before,
    #titleScreen::after {
      content: "";
      position: absolute;
      inset: -12%;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 82%, rgba(126, 230, 255, .58) 0 7px, transparent 8px),
        radial-gradient(circle at 78% 18%, rgba(126, 230, 255, .38) 0 12px, transparent 13px),
        radial-gradient(circle at 46% 76%, rgba(255, 255, 255, .24) 0 5px, transparent 6px),
        radial-gradient(circle at 66% 58%, rgba(126, 230, 255, .28) 0 16px, transparent 17px);
      animation: titleBubbles 10s linear infinite;
    }

    #titleScreen::after {
      animation-duration: 15s;
      animation-direction: reverse;
      opacity: .45;
    }

    #titleScreen .title-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      border-radius: inherit;
      background:
        linear-gradient(90deg, transparent, rgba(121, 232, 255, .1), transparent),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 4px);
      mix-blend-mode: screen;
      opacity: .28;
      animation: arcadeFlicker 2.6s steps(2, end) infinite;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: scale(.985); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes titleBubbles {
      from { transform: translate3d(0, 8%, 0); }
      to { transform: translate3d(0, -8%, 0); }
    }

    @keyframes arcadeFlicker {
      0%, 100% { opacity: .22; transform: translateX(0); }
      8% { opacity: .34; }
      9% { opacity: .16; }
      34% { opacity: .28; transform: translateX(1px); }
      35% { opacity: .18; transform: translateX(0); }
      72% { opacity: .32; }
      73% { opacity: .2; }
    }

    .panel {
      width: min(820px, 96vw);
      border: 3px solid rgba(255, 220, 50, .9);
      border-radius: 24px;
      padding: clamp(22px, 6vw, 54px);
      background:
        linear-gradient(135deg, rgba(0, 195, 255, .16), transparent 36%),
        linear-gradient(225deg, rgba(255, 220, 50, .16), transparent 34%),
        rgba(0, 0, 0, .72);
      box-shadow:
        0 0 32px rgba(0, 195, 255, .42),
        0 0 72px rgba(0, 195, 255, .2),
        inset 0 0 28px rgba(255, 220, 50, .09);
      backdrop-filter: blur(8px);
    }

    .title-panel {
      position: relative;
      z-index: 1;
      width: min(980px, 96vw);
      max-height: calc(100dvh - 28px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 2.5vw, 24px);
      border-color: rgba(121, 232, 255, .72);
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .34), rgba(0, 0, 0, .86)),
        rgba(0, 0, 0, .66);
      box-shadow:
        0 0 42px rgba(0, 195, 255, .52),
        0 0 110px rgba(0, 195, 255, .24),
        inset 0 0 38px rgba(121, 232, 255, .12);
    }

    .title-panel > * {
      position: relative;
      z-index: 4;
    }

    .title-art-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      margin: 6px auto 10px;
      overflow: hidden;
      border-radius: 18px;
      background: #000;
      box-shadow:
        0 0 34px rgba(0, 195, 255, .55),
        0 0 82px rgba(0, 100, 255, .2),
        inset 0 0 36px rgba(0, 195, 255, .18);
    }

    .title-art-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .08) 0 1px, transparent 1px 5px),
        radial-gradient(circle at 50% 52%, transparent 42%, rgba(0, 195, 255, .18));
      mix-blend-mode: screen;
      opacity: .55;
    }

    .title-art {
      display: block;
      width: min(100%, 900px);
      max-height: min(42vh, 430px);
      object-fit: contain;
      object-position: center;
      transform-origin: center;
      filter:
        drop-shadow(0 0 16px rgba(0, 195, 255, .65))
        drop-shadow(0 0 34px rgba(0, 90, 255, .35));
      animation: titleArtGlow 2.4s ease-in-out infinite alternate;
    }

    @keyframes titleArtGlow {
      from { filter: drop-shadow(0 0 12px rgba(0, 195, 255, .45)) drop-shadow(0 0 26px rgba(0, 90, 255, .25)); }
      to { filter: drop-shadow(0 0 22px rgba(0, 220, 255, .86)) drop-shadow(0 0 48px rgba(0, 90, 255, .42)); }
    }

    .brand {
      margin: 0 0 8px;
      color: #79e8ff;
      font-weight: 1000;
      letter-spacing: .15em;
      text-transform: uppercase;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    h1 {
      margin: 0 0 16px;
      color: #ffdc32;
      font-size: clamp(2.8rem, 12vw, 7.4rem);
      line-height: .86;
      letter-spacing: .02em;
      text-transform: uppercase;
      text-shadow:
        0 5px 0 #003d73,
        0 0 18px rgba(255, 220, 50, .7),
        0 0 42px rgba(0, 195, 255, .58);
    }

    .title-panel h1 {
      margin-bottom: 6px;
      font-size: clamp(2rem, 5.6vw, 4.8rem);
      animation: arcadeTitlePulse 1.6s ease-in-out infinite alternate;
    }

    @keyframes arcadeTitlePulse {
      from {
        transform: translateY(0) scale(1);
        text-shadow: 0 5px 0 #003d73, 0 0 18px rgba(255, 220, 50, .62), 0 0 42px rgba(0, 195, 255, .48);
      }
      to {
        transform: translateY(-2px) scale(1.015);
        text-shadow: 0 5px 0 #003d73, 0 0 26px rgba(255, 220, 50, .92), 0 0 60px rgba(0, 195, 255, .74);
      }
    }

    .tagline,
    .status,
    .orientation-note {
      color: #dff8ff;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 800;
    }

    .orientation-note {
      margin: 8px 0 2px;
      color: #79e8ff;
      font-size: clamp(.82rem, 2.5vw, 1rem);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .title-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 15px 26px;
      min-height: 54px;
      background: linear-gradient(180deg, #fff176, #ffd12f 52%, #f28b00);
      color: #051427;
      font: 1000 clamp(1rem, 3vw, 1.25rem) "Segoe UI", Arial, sans-serif;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 0 #7a3b00, 0 0 22px rgba(255, 220, 50, .32);
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #7a3b00, 0 0 20px rgba(255, 220, 50, .28);
    }

    #startBtn {
      min-width: min(280px, 82vw);
      font-size: clamp(1.12rem, 3vw, 1.55rem);
      animation: tapPulse 1.05s ease-in-out infinite alternate;
    }

    @keyframes tapPulse {
      from { transform: scale(1); box-shadow: 0 6px 0 #7a3b00, 0 0 22px rgba(255, 220, 50, .34); }
      to { transform: scale(1.055); box-shadow: 0 6px 0 #7a3b00, 0 0 38px rgba(255, 220, 50, .8), 0 0 60px rgba(0, 195, 255, .38); }
    }

    .secondary-btn {
      border: 2px solid rgba(121, 232, 255, .8);
      background: linear-gradient(180deg, #123d64, #061c38);
      color: #dff8ff;
      box-shadow: 0 6px 0 #001a3a, 0 0 22px rgba(0, 195, 255, .28);
    }

    .prompt-layer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(24px, env(safe-area-inset-bottom));
      z-index: 9999;
      display: none;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      pointer-events: none;
    }

    .prompt-layer.active {
      display: flex;
      pointer-events: auto;
      animation: promptPop .22s ease both;
    }

    .prompt-layer.active .prompt {
      animation: promptFlash .78s ease-in-out infinite alternate;
    }

    .prompt-layer.active .prompt:nth-child(2) {
      animation-delay: .08s;
    }

    .prompt-layer.active .prompt:nth-child(3) {
      animation-delay: .16s;
    }

    @keyframes promptPop {
      from { opacity: 0; transform: translateY(12px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes promptFlash {
      from { filter: brightness(1); transform: translateY(0); }
      to { filter: brightness(1.24); transform: translateY(-2px); }
    }

    .prompt {
      min-width: 96px;
      min-height: 64px;
      flex: 0 1 190px;
      border-radius: 14px;
      border: 3px solid #79e8ff;
      background: linear-gradient(180deg, #0dd7ff, #0059bd);
      color: #fff;
      font-size: clamp(1.05rem, 4vw, 1.45rem);
      font-weight: 1000;
      text-shadow: 0 2px 0 #002752;
      box-shadow: 0 6px 0 #001a3a, 0 0 28px rgba(0, 195, 255, .48);
      touch-action: manipulation;
      animation-play-state: running;
    }

    .prompt.attack {
      border-color: #ffdc32;
      background: linear-gradient(180deg, #fff176, #ff9f1c);
      color: #190b00;
      text-shadow: none;
    }

    .prompt.choice-green {
      border-color: #9cff8e;
      background: linear-gradient(180deg, #caff7f, #22c75a);
      color: #001b08;
      text-shadow: none;
      box-shadow: 0 0 34px rgba(80, 255, 108, .82), 0 6px 0 #06551b;
    }

    .prompt.choice-blue {
      border-color: #bbf4ff;
      background: linear-gradient(180deg, #bdf7ff, #007dff);
      color: #001a42;
      text-shadow: none;
      box-shadow: 0 0 34px rgba(0, 195, 255, .86), 0 6px 0 #00346b;
    }

    .prompt.choice-red {
      border-color: #ffb4a8;
      background: linear-gradient(180deg, #ff775d, #b60020);
      color: #fff;
      text-shadow: 0 2px 0 #52000d;
      box-shadow: 0 0 34px rgba(255, 48, 48, .86), 0 6px 0 #56000c;
    }

    .prompt:disabled {
      cursor: default;
      opacity: .82;
    }

    .prompt.is-hidden,
    .is-hidden {
      display: none !important;
    }

    .hud {
      position: absolute;
      left: 14px;
      top: max(12px, env(safe-area-inset-top));
      z-index: 11;
      padding: 8px 12px;
      border: 1px solid rgba(121, 232, 255, .55);
      border-radius: 999px;
      background: rgba(0, 0, 0, .62);
      color: #79e8ff;
      font: 900 .82rem "Segoe UI", Arial, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      box-shadow: 0 0 18px rgba(0, 195, 255, .22);
    }

    .scene-label {
      position: absolute;
      right: 14px;
      top: max(12px, env(safe-area-inset-top));
      z-index: 11;
      padding: 8px 12px;
      border: 1px solid rgba(255, 220, 50, .6);
      border-radius: 999px;
      background: rgba(0, 0, 0, .62);
      color: #ffdc32;
      font: 1000 .82rem "Segoe UI", Arial, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      box-shadow: 0 0 18px rgba(255, 220, 50, .2);
    }

    .ready-overlay {
      position: absolute;
      left: 50%;
      top: 21%;
      z-index: 13;
      display: none;
      transform: translateX(-50%);
      padding: 12px 22px;
      border: 2px solid rgba(255, 220, 50, .9);
      border-radius: 999px;
      background: rgba(0, 0, 0, .68);
      color: #ffdc32;
      font-size: clamp(1.35rem, 6vw, 3.2rem);
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: .08em;
      text-shadow: 0 0 20px rgba(255, 220, 50, .55);
      box-shadow: 0 0 28px rgba(0, 195, 255, .28);
    }

    .ready-overlay.active {
      display: block;
      animation: readyPulse .7s ease-in-out infinite alternate, readyGlow 1.2s ease-in-out infinite alternate;
    }

    @keyframes readyGlow {
      from { box-shadow: 0 0 22px rgba(0, 195, 255, .26), 0 0 34px rgba(255, 220, 50, .2); }
      to { box-shadow: 0 0 36px rgba(0, 195, 255, .58), 0 0 58px rgba(255, 220, 50, .38); }
    }

    .feedback-overlay {
      position: absolute;
      left: 50%;
      top: 34%;
      z-index: 14;
      display: none;
      transform: translate(-50%, -50%);
      width: min(92vw, 720px);
      color: #ffdc32;
      font-size: clamp(2.4rem, 11vw, 6.6rem);
      line-height: .9;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .04em;
      text-shadow:
        0 5px 0 #003d73,
        0 0 22px rgba(255, 220, 50, .76),
        0 0 46px rgba(0, 195, 255, .55);
      pointer-events: none;
    }

    .feedback-overlay.active {
      display: block;
      animation: feedbackPunch .5s ease both;
    }

    .feedback-overlay.good {
      color: #9cff8e;
      text-shadow: 0 5px 0 #064415, 0 0 26px rgba(80,255,108,.82);
    }

    .feedback-overlay.attack {
      color: #aeeeff;
      text-shadow: 0 5px 0 #003d73, 0 0 28px rgba(0,195,255,.86);
    }

    .feedback-overlay.fail {
      color: #ff6c5d;
      text-shadow: 0 5px 0 #56000c, 0 0 28px rgba(255,48,48,.86);
    }

    @keyframes feedbackPunch {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.82); }
      28% { opacity: 1; transform: translate(-50%, -50%) scale(1.07); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes readyPulse {
      from { opacity: .82; transform: translateX(-50%) scale(.98); }
      to { opacity: 1; transform: translateX(-50%) scale(1.04); }
    }

    .timer-wrap {
      position: fixed;
      left: 50%;
      bottom: calc(max(24px, env(safe-area-inset-bottom)) + 84px);
      z-index: 9998;
      display: none;
      width: min(560px, calc(100vw - 34px));
      height: 14px;
      transform: translateX(-50%);
      overflow: hidden;
      border: 2px solid rgba(121, 232, 255, .72);
      border-radius: 999px;
      background: rgba(0, 0, 0, .72);
      box-shadow: 0 0 18px rgba(0, 195, 255, .32);
    }

    .timer-wrap.active {
      display: block;
    }

    .timer-fill {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #79e8ff, #ffdc32, #ff533d);
      box-shadow: 0 0 18px rgba(255, 220, 50, .5);
      transform-origin: left center;
    }

    .timer-wrap.active .timer-fill {
      animation: choiceTimer var(--choice-time, 5s) linear forwards;
    }

    @keyframes choiceTimer {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }

    .ending {
      gap: 12px;
    }

    .progress-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      align-self: center;
      padding: 8px 14px;
      border: 1px solid rgba(123, 232, 255, .62);
      border-radius: 999px;
      background: rgba(0, 31, 50, .72);
      color: #baf5ff;
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
      box-shadow: 0 0 18px rgba(20, 183, 255, .28);
    }

    .coming {
      color: #79e8ff;
      font-size: clamp(1.1rem, 4vw, 1.65rem);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .button-row button {
      min-width: min(210px, 100%);
    }

    @media (max-width: 640px) {
      .prompt-layer {
        bottom: max(18px, env(safe-area-inset-bottom));
        gap: 8px;
      }

      .timer-wrap {
        bottom: calc(max(18px, env(safe-area-inset-bottom)) + 78px);
      }

      .prompt {
        min-width: 0;
        min-height: 66px;
        flex: 1;
        padding: 12px 8px;
        font-size: clamp(1rem, 4.5vw, 1.18rem);
      }

      .hud,
      .scene-label {
        max-width: calc(50vw - 18px);
        font-size: .68rem;
        padding: 7px 9px;
      }

      .panel {
        border-radius: 18px;
      }
    }

    @media (max-height: 760px) and (min-width: 821px) {
      .screen {
        padding: 10px;
      }

      .title-panel {
        width: min(900px, 96vw);
        padding: 12px 18px;
      }

      .brand {
        margin-bottom: 4px;
        font-size: .86rem;
      }

      .title-panel h1 {
        font-size: clamp(1.9rem, 4.8vw, 3.9rem);
        margin-bottom: 4px;
      }

      .title-art {
        max-height: min(36vh, 330px);
      }

      .tagline {
        margin: 3px 0;
        font-size: .95rem;
      }

      .orientation-note {
        margin-top: 4px;
        font-size: .78rem;
      }

      .title-actions {
        margin-top: 8px;
      }

      button {
        min-height: 48px;
        padding: 12px 22px;
      }
    }

    @media (orientation: portrait) and (max-width: 820px) {
      .game {
        place-items: start center;
        padding-top: max(64px, calc(env(safe-area-inset-top) + 58px));
      }

      video {
        width: 100vw;
        height: auto;
        max-height: calc(100dvh - 178px - env(safe-area-inset-bottom));
      }

      .screen {
        padding:
          max(18px, env(safe-area-inset-top))
          14px
          max(18px, env(safe-area-inset-bottom));
      }

      .panel {
        width: min(94vw, 620px);
        padding: clamp(18px, 6vw, 34px);
      }

      .title-panel {
        justify-content: center;
        max-height: calc(100dvh - 28px);
      }

      .title-art {
        max-height: min(38vh, 420px);
      }

      h1 {
        font-size: clamp(2.35rem, 13vw, 4.6rem);
      }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      video {
        width: min(100vw, 177.78dvh);
        height: min(100dvh, 56.25vw);
      }

      .prompt-layer {
        bottom: max(12px, env(safe-area-inset-bottom));
      }

      .timer-wrap {
        bottom: calc(max(12px, env(safe-area-inset-bottom)) + 74px);
      }

      .prompt {
        min-height: 58px;
      }

      .panel {
        padding: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="game" id="game">
    <div class="soap-bubbles" aria-hidden="true"></div>
    <div class="hud" id="hud">FMV Arcade Prototype</div>
    <div id="sceneLabel" class="scene-label">Scene 1: Woods Escape</div>
    <div id="transitionFade" class="transition-fade" aria-hidden="true">
      <div id="transitionMessage" class="transition-message">Loading Next Clip...</div>
    </div>
    <div id="screenFlash" class="screen-flash" aria-hidden="true"></div>

    <video id="player" playsinline preload="metadata"></video>
    <div id="readyOverlay" class="ready-overlay">Get Ready</div>
    <div id="feedbackOverlay" class="feedback-overlay" aria-live="polite"></div>
    <div id="timerWrap" class="timer-wrap" aria-hidden="true"><div id="timerFill" class="timer-fill"></div></div>

    <section id="titleScreen" class="screen active">
      <div class="panel title-panel">
        <p class="brand">Reh Dogg Games Plus Presents</p>
        <h1>REH DOGG:<br>SUDS OF FURY</h1>
        <div class="title-art-wrap" aria-label="REH DOGG: SUDS OF FURY arcade title art">
          <img class="title-art" src="assets/images/sudsy_title.png" alt="REH DOGG: SUDS OF FURY arcade title art">
        </div>
        <p class="tagline">Choose fast. Clean the streets. Survive the suds.</p>
        <p class="orientation-note">Best played in landscape mode</p>
        <div class="title-actions">
          <button id="startBtn" type="button">Tap To Start</button>
          <button id="fullscreenBtn" class="secondary-btn" type="button">Fullscreen</button>
        </div>
      </div>
    </section>

    <section id="endScreen" class="screen">
      <div class="panel ending">
        <p class="brand">Next Scene Placeholder</p>
        <p id="progressLabel" class="progress-label">Scene 1 Complete</p>
        <h1 id="comingTitle">SCENE 2<br>COMING SOON</h1>
        <p id="comingText" class="coming">The chase continues...</p>
        <div class="button-row">
          <button id="scene2Btn" type="button">Start Scene 2</button>
          <button id="retryScene2Btn" class="is-hidden" type="button">Retry Scene 2</button>
          <button id="againBtn" type="button">Play Again</button>
          <button id="titleBtn" type="button">Return To Title</button>
        </div>
      </div>
    </section>

    <div id="promptLayer" class="prompt-layer" aria-label="Choose your action">
      <button class="prompt" id="leftBtn" data-choice="left" type="button">Left</button>
      <button class="prompt" id="rightBtn" data-choice="right" type="button">Right</button>
      <button class="prompt" id="upBtn" data-choice="up" type="button">Up</button>
      <button class="prompt" id="downBtn" data-choice="down" type="button">Down</button>
      <button class="prompt attack" id="attackBtn" data-choice="attack" type="button">Attack</button>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const video = document.getElementById("player");
      const titleScreen = document.getElementById("titleScreen");
      const endScreen = document.getElementById("endScreen");
      const promptLayer = document.getElementById("promptLayer");
      const hud = document.getElementById("hud");
      const readyOverlay = document.getElementById("readyOverlay");
      const feedbackOverlay = document.getElementById("feedbackOverlay");
      const timerWrap = document.getElementById("timerWrap");
      const timerFill = document.getElementById("timerFill");
      const transitionFade = document.getElementById("transitionFade");
      const transitionMessage = document.getElementById("transitionMessage");
      const screenFlash = document.getElementById("screenFlash");
      const game = document.getElementById("game");
      const sceneLabel = document.getElementById("sceneLabel");
      const progressLabel = document.getElementById("progressLabel");
      const comingTitle = document.getElementById("comingTitle");
      const comingText = document.getElementById("comingText");
      const scene2Btn = document.getElementById("scene2Btn");
      const retryScene2Btn = document.getElementById("retryScene2Btn");
      const promptButtons = Array.from(document.querySelectorAll(".prompt"));

      const scenes = {
        1: {
          label: "Scene 1: Woods Escape",
          intro: "assets/video/scene_intro.mp4",
          fail: "assets/video/scene_right_fail.mp4",
          prompts: [
            {
              promptText: "Dodge left!",
              correctInput: "left",
              successVideo: "assets/video/scene_left_success.mp4",
              failVideo: "assets/video/scene_right_fail.mp4",
              sceneComplete: true
            }
          ],
          complete: "Scene 1 Complete",
          nextTitle: "SCENE 2<br>COMING SOON",
          nextText: "The chase continues...",
          showScene2Button: true
        },
        2: {
          label: "Scene 2: Highway Of Soap Doom",
          intro: "assets/video/scene2_intro.mp4",
          fail: "assets/video/scene2_fail.mp4",
          prompts: [
            {
              promptText: "Dodge left!",
              correctInput: "left",
              successVideo: "assets/video/scene2_left_success.mp4",
              failVideo: "assets/video/scene2_fail.mp4",
              setupVideo: "assets/video/scene2_attack_setup.mp4",
              nextPrompt: 1
            },
            {
              promptText: "Now attack!",
              correctInput: "attack",
              successVideo: "assets/video/scene2_attack_success.mp4",
              failVideo: "assets/video/scene2_fail.mp4",
              sceneComplete: true
            }
          ],
          complete: "Scene 2 Complete",
          nextTitle: "SCENE 3<br>COMING SOON",
          nextText: "The suds saga rolls on...",
          showScene2Button: false
        }
      };

      let phase = "title";
      let currentScene = 1;
      let activePromptIndex = 0;
      let promptShown = false;
      let promptTimer = null;
      let autoFailTimer = null;
      let readyTimer = null;
      let sceneAdvanceTimer = null;
      let branchOutcome = "success";
      let choiceLocked = false;
      const choiceWindowMs = 2000;
      const preloadCache = new Map();

      const sounds = {
        menu: new Audio("assets/audio/menu_theme.mp3"),
        button: new Audio("assets/audio/button_click.wav"),
        prompt: new Audio("assets/audio/prompt_flash.wav"),
        success: new Audio("assets/audio/success.wav"),
        fail: new Audio("assets/audio/fail.wav")
      };

      Object.values(sounds).forEach(sound => {
        sound.preload = "auto";
        sound.volume = 0.82;
        sound.available = true;
        sound.addEventListener("error", () => {
          sound.available = false;
        }, { once: true });
      });

      sounds.menu.loop = true;
      sounds.menu.volume = 0.28;

      function playSound(sound) {
        if (!(sound instanceof Audio) || sound.available === false) return;
        try {
          const effect = sound.cloneNode(true);
          effect.volume = sound.volume;
          effect.addEventListener("error", () => {
            sound.available = false;
          }, { once: true });
          effect.play().catch(() => {});
        } catch (error) {}
      }

      function playMusic() {
        if (!(sounds.menu instanceof Audio) || sounds.menu.available === false) return;
        try {
          sounds.menu.play().catch(() => {});
        } catch (error) {}
      }

      function stopMusic() {
        try {
          sounds.menu.pause();
          sounds.menu.currentTime = 0;
        } catch (error) {}
      }

      function flashScreen(tone) {
        screenFlash.className = `screen-flash active ${tone}`;
        window.setTimeout(() => {
          screenFlash.className = "screen-flash";
        }, 290);
      }

      function pulseSceneChange() {
        game.classList.remove("scene-zoom");
        void game.offsetWidth;
        game.classList.add("scene-zoom");
        window.setTimeout(() => {
          game.classList.remove("scene-zoom");
        }, 430);
      }

      function preloadClip(src) {
        if (!src || preloadCache.has(src)) return;
        const preloadVideo = document.createElement("video");
        preloadVideo.preload = "auto";
        preloadVideo.src = src;
        preloadVideo.muted = true;
        preloadVideo.playsInline = true;
        preloadCache.set(src, preloadVideo);
        try {
          preloadVideo.load();
        } catch (error) {}
      }

      function preloadScene(sceneNumber) {
        const scene = scenes[sceneNumber];
        if (!scene) return;
        preloadClip(scene.intro);
        preloadClip(scene.fail);
        (scene.prompts || []).forEach(prompt => {
          preloadClip(prompt.successVideo);
          preloadClip(prompt.failVideo);
          preloadClip(prompt.setupVideo);
        });
      }

      function preloadLikelyNextClips() {
        const scene = getScene();
        if (phase === "title") {
          preloadScene(1);
          return;
        }
        if (currentScene === 1) preloadScene(2);
        preloadClip(scene.fail);
        (scene.prompts || []).forEach(prompt => {
          preloadClip(prompt.successVideo);
          preloadClip(prompt.failVideo);
          preloadClip(prompt.setupVideo);
        });
      }

      function fadeBetweenClips(message = "LOADING NEXT CLIP...") {
        transitionMessage.innerHTML = message;
        transitionFade.classList.remove("active");
        void transitionFade.offsetWidth;
        transitionFade.classList.add("active");
        window.setTimeout(() => {
          transitionFade.classList.remove("active");
        }, 760);
      }

      function showScreen(screen) {
        titleScreen.classList.toggle("active", screen === "title");
        endScreen.classList.toggle("active", screen === "end");
      }

      function getScene() {
        return scenes[currentScene] || scenes[1];
      }

      function setScene(sceneNumber) {
        currentScene = sceneNumber;
        activePromptIndex = 0;
        sceneLabel.textContent = getScene().label;
      }

      function getCurrentPrompt() {
        const scene = getScene();
        return (scene.prompts || [])[activePromptIndex] || null;
      }

      function getAvailableChoices() {
        const prompt = getCurrentPrompt();
        return prompt ? { [prompt.correctInput]: prompt.successVideo } : {};
      }

      function getPromptText() {
        const prompt = getCurrentPrompt();
        return prompt ? prompt.promptText : "Choose!";
      }

      function showEndScreen() {
        window.clearTimeout(sceneAdvanceTimer);
        const scene = getScene();
        scene2Btn.classList.add("is-hidden");
        retryScene2Btn.classList.add("is-hidden");
        document.getElementById("againBtn").classList.remove("is-hidden");
        if (currentScene === 2 && branchOutcome === "fail") {
          progressLabel.textContent = "Scene 2 Failed";
          comingTitle.innerHTML = "FAILED";
          comingText.textContent = "YOU GOT WASHED OUT!";
          retryScene2Btn.classList.remove("is-hidden");
          document.getElementById("againBtn").classList.add("is-hidden");
        } else {
          progressLabel.textContent = scene.complete;
          comingTitle.innerHTML = scene.nextTitle;
          comingText.textContent = scene.nextText;
        }
        phase = "end";
        hud.textContent = "Scene Complete";
        showPrompts(false);
        showScreen("end");
        if (currentScene === 1 && scene.showScene2Button && branchOutcome !== "fail") {
          comingTitle.innerHTML = "SCENE 2<br>LOADING";
          comingText.textContent = "The chase continues...";
          fadeBetweenClips("HIGHWAY OF SOAP DOOM<br>GET READY");
          preloadScene(2);
          sceneAdvanceTimer = window.setTimeout(() => {
            startScene(2);
          }, 900);
        }
      }

      function showPrompts(show) {
        promptLayer.classList.toggle("active", show);
        timerWrap.classList.toggle("active", show);
        promptShown = show;
        choiceLocked = false;
        const choices = getAvailableChoices();
        promptButtons.forEach(button => {
          const choice = button.dataset.choice;
          const available = Boolean(choices[choice]);
          button.classList.toggle("is-hidden", show && !available);
          button.disabled = !show || !available;
          button.classList.remove("choice-green", "choice-blue", "choice-red");
        });
        window.clearTimeout(autoFailTimer);
        if (show) {
          timerFill.style.animation = "none";
          void timerFill.offsetWidth;
          timerFill.style.animation = "";
          timerWrap.style.setProperty("--choice-time", `${choiceWindowMs}ms`);
          playSound(sounds.prompt);
          autoFailTimer = window.setTimeout(() => {
            if (canShowChoicePrompt() && promptShown) choose("fail", true);
          }, choiceWindowMs);
        }
      }

      function canShowChoicePrompt() {
        return phase === "intro" || phase === "prompt_setup";
      }

      function showReady() {
        if (!canShowChoicePrompt() || promptShown) return;
        readyOverlay.classList.add("active");
        hud.textContent = "Get Ready";
        window.clearTimeout(readyTimer);
        readyTimer = window.setTimeout(() => {
          readyOverlay.classList.remove("active");
          if (canShowChoicePrompt() && !promptShown) {
            hud.textContent = getPromptText();
            showPrompts(true);
          }
        }, 750);
      }

      function getTransitionMessage(src, nextPhase) {
        if (currentScene === 2 && src === getScene().intro) return "HIGHWAY OF SOAP DOOM<br>GET READY";
        if (nextPhase === "intro") return "LOADING NEXT CLIP...";
        if (src === getScene().fail) return "LOADING NEXT CLIP...";
        return "LOADING NEXT CLIP...";
      }

      function playClip(src, nextPhase, message) {
        window.clearTimeout(promptTimer);
        window.clearTimeout(autoFailTimer);
        window.clearTimeout(readyTimer);
        readyOverlay.classList.remove("active");
        showPrompts(false);
        showScreen(null);
        fadeBetweenClips(message || getTransitionMessage(src, nextPhase));
        pulseSceneChange();
        phase = nextPhase;
        hud.textContent = nextPhase === "intro" ? "Get Ready" : getScene().label;
        video.src = src;
        video.currentTime = 0;
        const playPromise = video.play();
        if (playPromise) {
          playPromise.catch(() => {
            hud.textContent = "Tap the screen to continue";
          });
        }
      }

      function startScene(sceneNumber) {
        window.clearTimeout(sceneAdvanceTimer);
        setScene(sceneNumber);
        branchOutcome = "success";
        playSound(sounds.button);
        stopMusic();
        preloadLikelyNextClips();
        playClip(getScene().intro, "intro", sceneNumber === 2 ? "HIGHWAY OF SOAP DOOM<br>GET READY" : "LOADING NEXT CLIP...");
        promptTimer = window.setTimeout(() => {
          showReady();
        }, 5400);
      }

      function startGame() {
        startScene(1);
      }

      function requestFullscreen() {
        playSound(sounds.button);
        const target = document.getElementById("game") || document.documentElement;
        const request =
          target.requestFullscreen ||
          target.webkitRequestFullscreen ||
          target.msRequestFullscreen;
        if (request) {
          try {
            request.call(target);
          } catch (error) {}
        }
      }

      function choose(choice, timedOut = false) {
        if (!canShowChoicePrompt() || !promptShown || choiceLocked) return;
        const prompt = getCurrentPrompt();
        const isFail = choice === "fail";
        if (!prompt) return;
        choiceLocked = true;
        window.clearTimeout(autoFailTimer);
        timerWrap.classList.remove("active");
        promptButtons.forEach(button => button.disabled = true);
        playSound(sounds.button);

        if (isFail || choice !== prompt.correctInput) {
          playSound(sounds.fail);
          hud.textContent = timedOut || isFail ? "Too Late!" : "Wrong Way!";
          flashScreen(timedOut ? "timeout" : "fail");
          branchOutcome = "fail";
          preloadClip(prompt.failVideo || getScene().fail);
          showChoiceFeedback(choice, timedOut || isFail ? "TOO SLOW!" : "WRONG MOVE!", "fail", () => {
            playClip(prompt.failVideo || getScene().fail, "branch", "RETRYING SCENE...");
          });
          return;
        }

        playSound(sounds.success);
        branchOutcome = "success";
        preloadClip(prompt.successVideo);
        if (choice === "attack") {
          flashScreen("attack");
        }
        showChoiceFeedback(choice, getSuccessText(choice), choice === "attack" ? "attack" : "good", () => {
          playClip(prompt.successVideo, "prompt_success");
        });
      }

      function getSuccessText(choice) {
        if (choice === "attack") return "SUDS BLAST!";
        if (choice === "left") return "NICE DODGE!";
        if (choice === "right") return "GOOD MOVE!";
        if (choice === "up") return "JUMP CLEAR!";
        if (choice === "down") return "DUCK LOW!";
        return "NICE!";
      }

      function showChoiceFeedback(choice, text, tone, next) {
        const buttonMap = {
          left: document.getElementById("leftBtn"),
          right: document.getElementById("rightBtn"),
          up: document.getElementById("upBtn"),
          down: document.getElementById("downBtn"),
          attack: document.getElementById("attackBtn")
        };
        const toneClass = tone === "good" ? "choice-green" : tone === "attack" ? "choice-blue" : "choice-red";
        const targetButton = buttonMap[choice] || buttonMap.right;
        if (targetButton && !targetButton.classList.contains("is-hidden")) {
          targetButton.classList.add(toneClass);
        }
        feedbackOverlay.textContent = text;
        feedbackOverlay.className = `feedback-overlay active ${tone}`;
        window.setTimeout(() => {
          feedbackOverlay.className = "feedback-overlay";
          if (typeof next === "function") next();
        }, 500);
      }

      function resetGame() {
        window.clearTimeout(promptTimer);
        window.clearTimeout(autoFailTimer);
        window.clearTimeout(readyTimer);
        window.clearTimeout(sceneAdvanceTimer);
        readyOverlay.classList.remove("active");
        feedbackOverlay.className = "feedback-overlay";
        transitionFade.classList.remove("active");
        screenFlash.className = "screen-flash";
        game.classList.remove("scene-zoom");
        choiceLocked = false;
        video.pause();
        video.removeAttribute("src");
        video.load();
        setScene(1);
        branchOutcome = "success";
        phase = "title";
        hud.textContent = "FMV Arcade Prototype";
        showPrompts(false);
        showScreen("title");
        playMusic();
      }

      function replayScene() {
        window.clearTimeout(promptTimer);
        window.clearTimeout(autoFailTimer);
        window.clearTimeout(readyTimer);
        window.clearTimeout(sceneAdvanceTimer);
        readyOverlay.classList.remove("active");
        feedbackOverlay.className = "feedback-overlay";
        transitionFade.classList.remove("active");
        screenFlash.className = "screen-flash";
        game.classList.remove("scene-zoom");
        choiceLocked = false;
        promptShown = false;
        branchOutcome = "success";
        video.pause();
        showPrompts(false);
        setScene(1);
        playClip(getScene().intro, "intro");
        promptTimer = window.setTimeout(() => {
          showReady();
        }, 5400);
      }

      video.addEventListener("timeupdate", () => {
        if (!Number.isFinite(video.duration) || promptShown) return;
        if (phase === "intro" && video.duration - video.currentTime <= 5.4 && !readyOverlay.classList.contains("active")) {
          showReady();
        }
        if (phase === "prompt_setup" && video.duration - video.currentTime <= 2.4) {
          hud.textContent = getPromptText();
          showPrompts(true);
        }
      });

      video.addEventListener("ended", () => {
        if (phase === "intro" && !promptShown) {
          showReady();
          return;
        }
        if (phase === "prompt_success") {
          const prompt = getCurrentPrompt();
          if (Number.isInteger(prompt?.nextPrompt)) {
            activePromptIndex = prompt.nextPrompt;
            if (prompt.setupVideo) {
              playClip(prompt.setupVideo, "prompt_setup");
            } else {
              showReady();
            }
          } else if (prompt?.sceneComplete) {
            showEndScreen();
          } else {
            showEndScreen();
          }
          return;
        }
        if (phase === "prompt_setup") {
          if (promptShown) {
            choose("fail", true);
          } else {
            branchOutcome = "fail";
            playClip(getCurrentPrompt()?.failVideo || getScene().fail, "branch");
          }
          return;
        }
        if (phase === "branch") {
          showEndScreen();
        }
      });

      video.addEventListener("error", () => {
        hud.textContent = "Video file missing or cannot load";
        if (phase === "branch" || phase === "prompt_success" || phase === "prompt_setup") showEndScreen();
        if (phase === "intro") showPrompts(true);
      });

      document.getElementById("startBtn").addEventListener("click", startGame);
      document.getElementById("fullscreenBtn").addEventListener("click", () => {
        playMusic();
        requestFullscreen();
      });
      scene2Btn.addEventListener("click", () => {
        startScene(2);
      });
      retryScene2Btn.addEventListener("click", () => {
        fadeBetweenClips("RETRYING SCENE...");
        startScene(2);
      });
      document.getElementById("againBtn").addEventListener("click", () => {
        playSound(sounds.button);
        stopMusic();
        replayScene();
      });
      document.getElementById("titleBtn").addEventListener("click", () => {
        playSound(sounds.button);
        resetGame();
      });
      document.getElementById("leftBtn").addEventListener("click", () => choose("left"));
      document.getElementById("rightBtn").addEventListener("click", () => choose("right"));
      document.getElementById("upBtn").addEventListener("click", () => choose("up"));
      document.getElementById("downBtn").addEventListener("click", () => choose("down"));
      document.getElementById("attackBtn").addEventListener("click", () => choose("attack"));

      document.addEventListener("keydown", event => {
        if (phase === "title") playMusic();
        if (event.key === "ArrowLeft") choose("left");
        if (event.key === "ArrowRight") choose("right");
        if (event.key === "ArrowUp") choose("up");
        if (event.key === "ArrowDown") choose("down");
        if (event.key === " " || event.key === "Enter") {
          event.preventDefault();
          if (phase === "title") startGame();
          else choose("attack");
        }
      });

      document.addEventListener("contextmenu", event => event.preventDefault());
      document.addEventListener("touchmove", event => event.preventDefault(), { passive: false });
    })();
  </script>
</body>
</html>
